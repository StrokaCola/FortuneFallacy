<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>FortuneFallacy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=Exo+2:ital,wght@0,300;0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Inline so the splash paints BEFORE the React bundle parses.
     Removed once main.tsx clears the body[data-boot] attribute. */
  html, body { margin: 0; padding: 0; background: #07051a; height: 100%; }
  #boot-splash-inline {
    position: fixed; inset: 0; z-index: 99999;
    background: radial-gradient(ellipse at 50% 35%, #1c1245 0%, #0f0925 45%, #07051a 100%);
    display: grid; place-items: center;
    /* Wave T — extended 820ms fade-out so the Title screen's
       constellation polyline (which starts drawing at 0ms on mount)
       has visible overlap with the boot polyline's stars. The two
       constellations bridge across the swap instead of cutting. */
    transition: opacity 820ms ease-out;
    pointer-events: none;
  }
  /* During the boot→app handoff, soften the radial backdrop so the
     React stars/cosmos backdrop bleeds through earlier — eye reads
     the title screen rising into view as the boot polyline lingers. */
  body:not([data-boot]) #boot-splash-inline { opacity: 0; background: transparent; }
  #boot-splash-inline svg { width: min(280px, 60vmin); height: auto; }
  #boot-splash-inline .line {
    stroke: #f5c451; stroke-width: 0.5; fill: none;
    stroke-dasharray: 60; stroke-dashoffset: 60;
    animation: boot-draw 1100ms ease-out forwards;
    filter: drop-shadow(0 0 4px rgba(245,196,81,0.65));
  }
  #boot-splash-inline .star {
    fill: #ffd97a;
    opacity: 0;
    filter: drop-shadow(0 0 4px rgba(245,196,81,0.85));
    animation: boot-pop 600ms ease-out forwards;
  }
  #boot-splash-inline .label {
    fill: #bba8ff; font-family: 'JetBrains Mono', monospace;
    font-size: 3px; letter-spacing: 0.4em; text-transform: uppercase;
    opacity: 0;
    animation: boot-fade 600ms ease-out 900ms forwards;
  }
  @keyframes boot-draw {
    to { stroke-dashoffset: 0; }
  }
  @keyframes boot-pop {
    0%   { opacity: 0; transform: scale(0.3); }
    60%  { opacity: 1; transform: scale(1.1); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes boot-fade {
    to { opacity: 0.85; }
  }
</style>
</head>
<body data-boot>
<div id="boot-splash-inline" aria-hidden="true">
  <svg viewBox="0 0 100 60" preserveAspectRatio="xMidYMid meet">
    <!-- Constellation lines connecting 5 stars — drawn-in over
         1.1s, then the stars pop in, then the label fades up. -->
    <polyline class="line" points="18,40 36,18 52,32 70,16 86,42" />
    <circle class="star" cx="18" cy="40" r="1.5" style="animation-delay: 200ms" />
    <circle class="star" cx="36" cy="18" r="1.8" style="animation-delay: 420ms" />
    <circle class="star" cx="52" cy="32" r="2.2" style="animation-delay: 640ms" />
    <circle class="star" cx="70" cy="16" r="1.7" style="animation-delay: 860ms" />
    <circle class="star" cx="86" cy="42" r="1.5" style="animation-delay: 1080ms" />
    <text class="label" x="50" y="56" text-anchor="middle">◇ ascending ◇</text>
  </svg>
</div>
<canvas id="bg-next"></canvas>
<div id="stage-root">
  <div id="cosmos-root"></div>
  <canvas id="three-next"></canvas>
  <!-- Void Mode background-scene host. Sits between cosmos and the
       dice canvas so the procgen black-hole scene replaces the
       cosmos backdrop while the 3D dice still render above it. The
       React app portals <VoidScene /> into this node when run.mode
       === 'void'; outside void it stays empty. Same z as cosmos
       (z=0) — document order puts it above cosmos but the dice
       canvas (z=1) and #next-root (z=2) paint above. -->
  <div id="void-root" style="position:absolute;inset:0;z-index:0;pointer-events:none;"></div>
  <div id="next-root"></div>
</div>
<script src="./portal.js"></script>
<script type="module" src="./src-next/main.tsx"></script>
</body>
</html>
